<div class="grid gap-4 sm:grid-cols-2">
  <div>
    <label for="location" class="mb-1 block text-sm font-medium text-slate-700">
      Location
    </label>

    <select id="location" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5
             text-sm text-slate-900 outline-none
             focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [value]="selectedLocation() ?? ''"
      (change)="onLocationChange($event)">
      <option value="">All locations</option>

      @for (location of locations(); track location.id) {
      <option [value]="location.id">
        {{ location.name }}
      </option>
      }
    </select>
  </div>

  <div>
    <label for="status" class="mb-1 block text-sm font-medium text-slate-700">
      Status
    </label>

    <select id="status" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5
             text-sm text-slate-900 outline-none
             focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [value]="selectedStatus() ?? ''"
      (change)="onStatusChange($event)">
      <option value="">All statuses</option>
      <option value="booked">Booked</option>
      <option value="confirmed">Confirmed</option>
      <option value="checked_in">Checked In</option>
      <option value="in_progress">In Progress</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
      <option value="no_show">No Show</option>
    </select>
  </div>
</div>

@if (hasActiveFilters()) {
<button type="button" class="mt-3 text-sm font-medium text-slate-600 underline
           underline-offset-4 hover:text-slate-900
           focus:outline-none focus:ring-2 focus:ring-slate-400" (click)="clear.emit()">
  Clear filters
</button>
}
